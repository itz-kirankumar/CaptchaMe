<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwind Books - checkout (CaptchaMe customer demo)</title>
<style>
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; background:#faf7f0; color:#26221c; }
  header { background:#26221c; color:#faf7f0; padding:16px 28px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:20px; letter-spacing:.5px; }
  header span { font-size:13px; opacity:.75; }
  main { max-width:680px; margin:0 auto; padding:36px 20px 60px; }
  h1 { font-size:28px; margin:0 0 6px; }
  .cart { background:#fff; border:1px solid #e3dccb; border-radius:10px; padding:18px 22px; margin:18px 0; }
  .row { display:flex; justify-content:space-between; padding:7px 0; font-size:15px; }
  .total { border-top:1px solid #e3dccb; margin-top:8px; padding-top:12px; font-weight:bold; }
  form { display:grid; gap:10px; margin-top:22px; }
  label { font-size:14px; color:#6b6455; }
  input { font:inherit; padding:10px 12px; border:1px solid #d8cfba; border-radius:8px; background:#fff; }
  button { background:#2f6b3a; color:#fff; border:0; border-radius:8px; padding:14px 26px; font-size:16px; cursor:pointer; justify-self:start; font-family:inherit; }
  #done { display:none; background:#eaf5ec; border:1px solid #bfe0c6; color:#245c30; border-radius:10px; padding:16px 20px; font-size:15px; margin-top:16px; }
  code { background:#efe9da; padding:1px 6px; border-radius:5px; font-size:13px; }
  .back { font-size:13px; } .back a { color:#6b6455; }
  .hint { font-size:13px; color:#6b6455; }
</style></head><body>
<header><b>Northwind Books</b><span>est. 1998 &middot; demo storefront</span></header>
<main>
  <h1>Checkout</h1>
  <div class="cart">
    <div class="row"><span>The Master and Margarita (hardcover)</span><span>$18.00</span></div>
    <div class="row"><span>Shipping</span><span>$4.50</span></div>
    <div class="row total"><span>Total</span><span>$22.50</span></div>
  </div>

  <form id="checkout" autocomplete="off">
    <label for="n">Name</label><input id="n" name="name" required>
    <label for="e">Email for the receipt</label><input id="e" name="email" type="email" required>
    <button type="submit">Place order - $22.50</button>
  </form>
  <p class="hint">No captcha box here. Northwind protects checkout with one script tag; most shoppers never see a check.</p>
  <div id="done"></div>
  <p class="back" style="margin-top:28px"><a href="/">Built with CaptchaMe</a> &middot; <a href="/integrations">Get this for your site</a></p>
</main>
<!-- This is the entire integration: -->
<script src="/widget.js"></script>
<script>
CaptchaMe.protect(document.getElementById('checkout'), {
  autoSubmit: false,
  onPass: function (token, info) {
    var el = document.getElementById('done');
    el.style.display = 'block';
    el.innerHTML = 'Order placed. ' + (info && info.tier === 'pass' ? 'Verified invisibly' : info && info.reason ? 'Verified by the button check' : 'Verified by a live check') +
      '. Pass <code>' + String(token).slice(0, 18) + '...</code> is bound to this browser and this exact order; Northwind would verify it server-side with POST /api/pass/verify.';
  }
});
</script>
</body></html>
