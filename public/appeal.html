<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appeal a cap - CaptchaMe</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body><main>
<nav class="nav">
  <a class="brand" href="/"><img src="/logo.svg" width="26" height="26" alt="">CaptchaMe</a>
  <div class="links">
    <a href="/check.html">Try again</a>
    <a href="/dashboard.html">Dashboard</a>
  </div>
</nav>

<h1 class="page">Never a silent block</h1>
<p class="sub">If the fair-share cap caught you by mistake, say so. A human reviews every appeal and can overturn it.</p>

<div class="card">
  <form id="f">
    <label for="actor">Your actor id</label>
    <input id="actor" required autocomplete="off">
    <label for="msg">What happened?</label>
    <textarea id="msg" rows="4" required placeholder="I am a real person testing the demo and my allowance ran out..."></textarea>
    <p style="margin-top:14px"><button>Send appeal</button></p>
  </form>
  <div id="out"></div>
</div>
<p class="note"><a href="/">Back</a></p>
<script>
document.getElementById('actor').value = new URLSearchParams(location.search).get('actor') || '';
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/appeal', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ actor: document.getElementById('actor').value, message: document.getElementById('msg').value }) });
  const b = await r.json();
  document.getElementById('out').innerHTML = r.ok ? `<div class="result pass">${b.reason}</div>` : `<div class="result fail">${b.reason || 'Failed'}</div>`;
});
</script>
</main></body></html>
